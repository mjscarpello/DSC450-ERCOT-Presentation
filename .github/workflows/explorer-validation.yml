name: Validate research explorer
on:
  pull_request:
  push:
    branches:
      - feature/research-explorer-milestone-1
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check JavaScript syntax
        run: node --check "ERCOT project context web/explorer.js"
      - name: Install graph package
        run: python -m pip install -e "./ERCOT project context web[all]"
      - name: Run graph and explorer tests
        run: python -m unittest discover -s "ERCOT project context web/tests" -p "test_*.py" -v
      - name: Check offline viewer still builds
        run: cd "ERCOT project context web" && ercot-web viewer
      - name: Install Chromium browser tests
        run: |
          npm install --no-save playwright@1.56.1
          npx playwright install --with-deps chromium
      - name: Test research explorer in desktop and mobile browsers
        run: |
          python -m http.server 8765 &
          sleep 2
          node "ERCOT project context web/tests/smoke-explorer.cjs"
      - name: Upload browser screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: research-explorer-browser-screenshots
          path: /tmp/ercot-explorer-screenshots
          if-no-files-found: ignore
